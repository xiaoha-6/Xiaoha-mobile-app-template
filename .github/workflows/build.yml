name: Build App templates
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [xiaoha-react, xiaoha-vue]
    defaults:
      run:
        working-directory: ${{ matrix.template }}/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
